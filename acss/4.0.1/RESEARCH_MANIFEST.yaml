# NovaBase NB-000 Research Manifest
#
# Purpose:
# Operational tracker for ACSS 4.0.1 forensic research.
#
# Governing documents:
# - NOVABASE_NORTH_STAR_v0.1.0.md
# - AGENTS.md
# - NOVABASE_ROADMAP_v0.1.0.md
#
# This manifest tracks execution state only.
# It does not define NovaBase design law.

manifest_version: "0.1.0"

project:
  name: "NovaBase"
  phase: "NB-000"
  phase_name: "ACSS 4.0.1 Forensic Research"
  status: "planned"

source:
  product: "Automatic.css"
  version: "4.0.1"
  reference_path: "reference/acss/4.0.1/plugin/"
  immutable_reference: true

status_values:
  - "blocked"
  - "pending"
  - "active"
  - "review"
  - "accepted"
  - "needs_followup"

rules:
  foundation_before_domains: true
  implementation_allowed: false
  reference_is_read_only: true
  evidence_required: true
  fixtures_required_when_deterministic: true
  unresolved_must_be_explicit: true

foundations:

  F01:
    name: "Settings Schema"
    status: "accepted"
    branch: "nb000-f01-settings"
    path: "research/acss/4.0.1/foundations/settings/"
    review:
      path: "research/acss/4.0.1/reviews/NB_ACSS_F01_SETTINGS_SCHEMA_REVIEW_v0.1.0.md"
      verdict: "ACCEPT WITH NON-BLOCKING NOTES"
    depends_on: []
    deliverables:
      - "NB_ACSS_SETTINGS_SCHEMA_SPEC_v0.1.0.md"
      - "NB_ACSS_SETTINGS_SCHEMA_SOURCE_MAP_v0.1.0.md"
      - "acss-settings-map.json"
    objectives:
      - "Map setting IDs, titles, defaults, units, controls, conditions, and dependencies."
      - "Map settings to relevant internal variables and generated CSS tokens where traceable."
    unresolved:
      - id: "F01-U01"
        summary: "Full client-side displayWhen/displayWhenOr evaluator semantics in the minified dashboard bundle."
        disposition: "Deferred unless later compatibility requires exact UI-evaluator parity."
      - id: "F01-U02"
        summary: "Whether site-local acss/config/* filters add options.variable overrides at runtime."
        disposition: "Extensibility exists; no shipped reference instances. Remains unresolved."
      - id: "F01-U03"
        summary: "Exhaustive runtime-expanded colour setting/token inventory (cartesian of shades × channels)."
        disposition: "Expansion pattern confirmed; full enumeration handed to F02/F04/D10 or mechanical fixtures."
      - id: "F01-U04"
        summary: "Complete setting ID → emitted CSS custom-property mapping through SCSS templates."
        disposition: "Handoff to F04 token/naming architecture."

  F02:
    name: "Formula and Function Library"
    status: "pending"
    branch: "nb000-f02-formulas"
    path: "research/acss/4.0.1/foundations/formulas/"
    depends_on: []
    deliverables:
      - "NB_ACSS_FOUNDATION_FORMULAS_SPEC_v0.1.0.md"
      - "NB_ACSS_FOUNDATION_FORMULAS_SOURCE_MAP_v0.1.0.md"
      - "foundation-formula-fixtures.json"
    objectives:
      - "Identify shared mathematical and transformation primitives."
      - "Document fluid interpolation, units, scales, grid maths, colour helpers, and related shared logic."

  F03:
    name: "Compilation Pipeline"
    status: "pending"
    branch: "nb000-f03-compilation"
    path: "research/acss/4.0.1/foundations/compilation/"
    depends_on: []
    deliverables:
      - "NB_ACSS_COMPILATION_PIPELINE_SPEC_v0.1.0.md"
      - "NB_ACSS_COMPILATION_PIPELINE_SOURCE_MAP_v0.1.0.md"
    objectives:
      - "Trace settings from configuration through transformers into SCSS and generated CSS."
      - "Identify generation stages, ordering, and important transformation boundaries."

  F04:
    name: "Token and Naming Architecture"
    status: "pending"
    branch: "nb000-f04-tokens"
    path: "research/acss/4.0.1/foundations/tokens/"
    depends_on: []
    deliverables:
      - "NB_ACSS_TOKEN_ARCHITECTURE_SPEC_v0.1.0.md"
      - "NB_ACSS_TOKEN_ARCHITECTURE_SOURCE_MAP_v0.1.0.md"
      - "acss-token-map.json"
    objectives:
      - "Map relationships between settings, SCSS variables, CSS custom properties, aliases, utilities, and components."
      - "Identify naming conventions and token-generation patterns."

